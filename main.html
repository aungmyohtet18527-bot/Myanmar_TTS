<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myanmar Voice Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>

  <div class="container">
    <div class="glass-card">
      <h1>🎤 Myanmar Voice Studio</h1>
      <p>မြန်မာစာကို အသံအဖြစ် ပြောင်းပြီး MP3 Download လုပ်နိုင်ပါသည်</p>

      <textarea id="text" placeholder="မြန်မာစာ ရေးထည့်ပါ..."></textarea>

      <div class="controls">
        <button id="speakBtn">▶ Play</button>
        <button id="stopBtn">■ Stop</button>
        <button id="downloadBtn">⬇ MP3 Download</button>
      </div>

      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
